<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pyra</title>
<link rel="icon" href="/brand/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/brand/mark-256.png">
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/style.css">
<body>
  <header class="bar">
    <a class="brand" href="#" title="Pyra">
      <img class="mark" src="/brand/mark-128.png" alt="">
      <img class="wordmark" src="/brand/wordmark.png" alt="Pyra">
    </a>
    <nav class="tabs">
      <button class="tab on" data-view="board">Milestones</button>
      <button class="tab" data-view="terms">Terminals <span class="badge" id="term-count">0</span></button>
    </nav>
    <div class="right">
      <span id="live" class="live" title="Live Claude sessions on this machine"></span>
      <span id="err" class="err"></span>
    </div>
  </header>

  <main>
    <aside id="side">
      <button class="proj all on" data-id="">
        <img class="pe glyph" src="/brand/mark-128.png" alt=""><span class="pn">All projects</span>
      </button>
      <div id="projects"></div>
      <button class="add" id="add-project">＋ Track a project</button>
    </aside>

    <section id="view-board" class="view"></section>
    <section id="view-terms" class="view hidden">
      <div class="terms-bar">
        <span class="hint">Every pane is a real terminal. Closing the tab does not kill the session.</span>
        <span class="grow"></span>
        <label class="cols">Columns
          <select id="cols"><option>1</option><option selected>2</option><option>3</option></select>
        </label>
      </div>
      <div id="grid" class="grid cols-2"></div>
    </section>
  </main>

  <dialog id="browser">
    <form method="dialog">
      <h3>Track a project</h3>
      <div class="crumb" id="crumb"></div>
      <ul id="dirs" class="dirs"></ul>
      <menu><button value="cancel">Close</button></menu>
    </form>
  </dialog>

  <!-- Les deux visionneuses du haut de page. Elles sont en LECTURE SEULE : le graphe
       du code et l'arbre des commits donnent à voir ce que le dépôt contient déjà.
       Chacune a une adresse (#p=<projet>&d=graph), pour qu'une capture headless
       puisse les ouvrir sans clic. -->
  <dialog id="graph" class="big">
    <div class="dhead">
      <h3 id="graph-title">Knowledge graph</h3>
      <span class="dmeta" id="graph-meta"></span>
      <span class="grow"></span>
      <input id="graph-q" class="dsearch" type="search" placeholder="Find a symbol or a file…" autocomplete="off">
      <button class="btn ghost" id="graph-fit">Fit</button>
      <button class="btn ghost" id="graph-close">Close</button>
    </div>
    <div class="dbody" id="graph-body"></div>
  </dialog>

  <dialog id="git" class="big">
    <div class="dhead">
      <h3 id="git-title">Git tree</h3>
      <span class="dmeta" id="git-meta"></span>
      <span class="grow"></span>
      <button class="btn ghost" id="git-close">Close</button>
    </div>
    <div class="dbody scroll" id="git-body"></div>
  </dialog>

  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script src="/app.js"></script>
</body>
